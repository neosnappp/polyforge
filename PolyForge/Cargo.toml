[package]
name = "polyforge"
version = "0.1.0"
edition = "2021"
authors = ["neosnap"]
license = "MIT"
description = "Fast binary polyglot synthesizer and inspector for image and archive formats."
readme = "README.md"
repository = "https://github.com/neosnap/polyforge"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
anyhow = "1.0"
colored = "2.1"
byteorder = "1.5"
crc32fast = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
